name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir _site && cp -r index.html manifest.webmanifest icons css js vendor _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # name this release's files after the commit so phones fetch them fresh, and publish version.json for the
      # game's update check
      - name: Stamp the release
        run: |
          VERSION="${GITHUB_SHA::7}"
          node scripts/stamp.mjs _site "$VERSION"
          grep -q "app-version\" content=\"$VERSION\"" _site/index.html
          node -e "import('./_site/js/host.js?v=$VERSION').then((m) => { if (!m.HostSession) process.exit(1); })"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
